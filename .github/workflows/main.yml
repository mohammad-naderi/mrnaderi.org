name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @- <<'JSON'
          {
            "host": "mrnaderi.org",
            "key": "128a5bcaf4a9d4f627d02876597e4e8b",
            "keyLocation": "https://mrnaderi.org/128a5bcaf4a9d4f627d02876597e4e8b.txt",
            "urlList": [
              "https://mrnaderi.org/",
              "https://mrnaderi.org/philosophy",
              "https://mrnaderi.org/philosophy/persian",
              "https://mrnaderi.org/philosophy/persian/terms",
              "https://mrnaderi.org/writing",
              "https://mrnaderi.org/publications",
              "https://mrnaderi.org/teaching",
              "https://mrnaderi.org/about",
              "https://mrnaderi.org/about/persian",
              "https://mrnaderi.org/teaching/meaning-structure-determination",
              "https://mrnaderi.org/teaching/adventures-french-structuralism-course-notes",
              "https://mrnaderi.org/teaching/reading-deleuze-structuralism",
              "https://mrnaderi.org/teaching/unconscious-materialism-hegel",
              "https://mrnaderi.org/teaching/dark-enlightenment-from-acceleration-to-control",
              "https://mrnaderi.org/teaching/dark-enlightenment-collapse-of-transition"
            ]
          }
          JSON
