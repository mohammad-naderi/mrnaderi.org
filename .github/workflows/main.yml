name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build public CV downloads
        run: |
          python -m pip install --disable-pip-version-check python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer
          python scripts/build_public_cv.py
          libreoffice --headless --convert-to pdf --outdir public/documents public/documents/Mohammad-Reza-Naderi-CV.docx

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
